<h2>Cart</h2>

<div *ngFor="let item of items">
  <p>{{item.product.name}}</p>
  <p>Qty: {{item.quantity}}</p>
  <p>Total: ₹{{item.product.price * item.quantity}}</p>

  <button (click)="remove(item.product.id)">Remove</button>
</div>

<h3>Total: ₹{{total}}</h3>
<button (click)="clear()">Clear Cart</button>
