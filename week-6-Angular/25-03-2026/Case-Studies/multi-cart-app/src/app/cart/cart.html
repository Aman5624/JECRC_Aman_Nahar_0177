<section>
	<h2>Cart</h2>

	@if (getCartItems().length === 0) {
		<p>Your cart is empty.</p>
	} @else {
		<ul>
			@for (item of getCartItems(); track $index) {
				<li>{{ item }}</li>
			}
		</ul>
	}

	<button type="button" (click)="clearCart()" [disabled]="getCartItems().length === 0">
		Clear Cart
	</button>
</section>
